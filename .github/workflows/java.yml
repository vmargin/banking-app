name: Java verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build bootstrap or run real tests
        shell: bash
        run: |
          if find src/test -name '*.java' -print -quit | grep -q .; then
            sh ./mvnw --batch-mode verify
          else
            echo '::notice::Bootstrap only: no Java tests exist. No banking behaviour has been verified.'
            sh ./mvnw --batch-mode compile
          fi
